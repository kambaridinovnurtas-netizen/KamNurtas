<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krossdrop - Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <canvas id="bg-canvas"></canvas>

    <div class="section-wrapper">
      <div class="wrapper" id="card">
        <div class="imgs">
          <a href="./index.html" class="close-btn">
            <i class="fa-solid fa-xmark"></i>
          </a>
        </div>

        <div class="wrapper-texts">
          <h1 class="text">KROSSDROP'GA QO'SHILING</h1>
          <p class="text-1">
            Eksklyuziv yangiliklar va drop'lardan xabardor bo'ling.
          </p>
        </div>

        <form class="login" id="registerForm" onsubmit="event.preventDefault();">
          <div class="login-group">
            <label class="text-2">TO'LIQ ISMINGIZ</label>
            <div class="input-field">
              <i class="fa-regular fa-user field-icon"></i>
              <input type="text" class="inpt" placeholder="Ali Valiyev" required />
            </div>
          </div>

          <div class="login-group">
            <label class="text-2">EMAIL</label>
            <div class="input-field">
              <i class="fa-regular fa-envelope field-icon"></i>
              <input type="email" class="inpt" placeholder="name@domain.com" required />
            </div>
          </div>

          <div class="login-group">
            <label class="text-2">PAROL</label>
            <div class="input-field">
              <i class="fa-solid fa-lock field-icon"></i>
              <input type="password" id="passwordInput" class="inpt" placeholder="••••••••" required />
              <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
            </div>
            <div class="strength-bar" id="strengthBar"></div>
          </div>

          <button type="submit" class="btn" id="submitBtn">RO'YXATDAN O'TISH</button>
        </form>

        <div class="profiles">
          <p class="profile-text">
            Profilingiz bormi?
            <a href="./login.html" class="kirish">Kirish</a>
          </p>
        </div>
      </div>
    </div>

    <script>
      const togglePassword = document.querySelector('#togglePassword');
      const passwordInput = document.querySelector('#passwordInput');

      togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
      });

      const strengthBar = document.getElementById('strengthBar');
      passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;
        if (val.length === 0) {
          strengthBar.style.width = '0%';
        } else if (val.length < 6) {
          strengthBar.style.width = '33%';
          strengthBar.style.backgroundColor = '#ef4444';
        } else if (val.length < 10) {
          strengthBar.style.width = '66%';
          strengthBar.style.backgroundColor = '#f59e0b';
        } else {
          strengthBar.style.width = '100%';
          strengthBar.style.backgroundColor = '#10b981';
        }
      });

      const card = document.getElementById('card');
      document.addEventListener('mousemove', (e) => {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
        card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
      });

      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');

      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 60 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        size: Math.random() * 2 + 1
      }));

      function animate() {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < particles.length; i++) {
          let p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0 || p.x > width) p.vx *= -1;
          if (p.y < 0 || p.y > height) p.vy *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(214, 255, 63, 0.4)';
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            let p2 = particles[j];
            let dist = Math.hypot(p.x - p2.x, p.y - p2.y);

            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(214, 255, 63, ${1 - dist / 120})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    </script>
  </body>
</html>
